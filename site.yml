---

- name: Scenario Setup Playbook
  hosts: all
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/vars/main.yml"

  vars_prompt:
    - name: scenario_option
      private: no
      prompt: |-

        Please choose an option:
          {% for i in scenarios_allowed %}
          {{ i }}. Scenario #{{ i }}
          {% endfor %}

        Enter the number corresponding to your choice

  tasks:
    - name: Check if selected option is a scenario
      tags: always
      ansible.builtin.assert:
        that:
          - scenario_option is integer
          - scenario_option in scenarios_allowed
        fail_msg: "Scenario '{{ scenario_option }}' not found"

    - name: Deployment Block
      tags: ['deploy']
      block:
        - name: Get scenario variables
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/vars/scenario-{{ scenario_option }}.yml"
            hash_behaviour: replace

        # Delete namespace
        # Setup namespace / operator
        - name: Setup namespace and operator
          ansible.builtin.include_role:
            name: operator

        # Deploy the scenario
        - name: Setup scenario
          ansible.builtin.include_role:
            name: scenario_{{ scenario_option }}
      rescue:
        - name: Report failure message
          ansible.builtin.fail:
            msg: |
              There was a failure in setting up the scenario. Please re-run the setup again to see if
              it succeeds. Contact adminstrator if you continue to have issues with setting up the scenario.


    - name: Break Block
      tags: ['never', 'break']
      block:
        - name: Get scenario variables
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/vars/scenario-{{ scenario_option }}.yml"
            hash_behaviour: replace

        # Deploy the scenario
        - name: Setup scenario
          ansible.builtin.include_role:
            name: scenario_{{ scenario_option }}
            tasks_from: break.yml

        - name: Final Message
          ansible.builtin.debug:
            msg: Done breaking stuff. Have fun! :)
      rescue:
        - name: Report failure message
          ansible.builtin.fail:
            msg: |
              There was a failure in setting up the scenario. Please re-run the setup again to see if
              it succeeds. Contact adminstrator if you continue to have issues with setting up the scenario.


    - name: Fix Block
      tags: ['never', 'fix']
      block:
        - name: Get scenario variables
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/vars/scenario-{{ scenario_option }}.yml"
            hash_behaviour: replace

        # Deploy the scenario
        - name: Fix scenario
          ansible.builtin.include_role:
            name: scenario_{{ scenario_option }}
            tasks_from: fix.yml

        - name: Final Message
          ansible.builtin.debug:
            msg: Things should be good to go now.
      rescue:
        - name: Report failure message
          ansible.builtin.fail:
            msg: |
              There was a failure in setting up the scenario. Please re-run the setup again to see if
              it succeeds. Contact adminstrator if you continue to have issues with setting up the scenario.              