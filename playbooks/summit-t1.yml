---
- name: Hello World Loop Demo
  hosts: all

  tasks:
    - name: Print "Hello, World!" five times
      ansible.builtin.debug:
        msg: "Hello, Red Hat Summit! This is a demo playbook in SUMMIT-T1 (Iteration {{ item }}) from host {{ ansible_fqdn }}"
      # The loop will iterate over the list [1, 2, 3, 4, 5]
      loop: [1, 2, 3, 4, 5]
