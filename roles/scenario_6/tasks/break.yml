---
- name: Adjusting some stuff....
  no_log: "{{ no_log | default(True) }}"
  block:

  - name: Set role variables
    ansible.builtin.include_vars:
      file: "{{ role_path }}/vars/main.yml"
      hash_behaviour: replace

  - name: Gather some facts
    ansible.builtin.setup:
      filter: "ansible_date_time"

  - name: Taking a Short Nap
    ansible.builtin.set_fact:
      break_model: codellama-7b-instruct
      break_url: https://litellm-prod.apps.maas.redhatworkshops.io/v1

  - name: Perform Level 7 Compliance Yoga
    kubernetes.core.k8s:
      api_version: v1
      kind: Secret
      name: chatbot-configuration-secret
      namespace: "{{ namespace }}"
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: chatbot-configuration-secret
          namespace: "{{ namespace }}"
        type: Opaque
        data:
          chatbot_model: "{{ break_model | b64encode }}"
          chatbot_token: "{{ chatbot_token | b64encode }}"
          chatbot_url: "{{ break_url | b64encode }}"

  - name: Re-platform the Core Data Spigot
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: aap.ansible.com/v1alpha1
        kind: AnsibleAutomationPlatform
        metadata:
          name: "{{ _scenario_name }}-aap"
          namespace: "{{ namespace }}"
        spec:
          lightspeed:
            chatbot_config_secret_name: chatbot-configuration-secret
            disabled: false

  - name: Locate Missing Sock Inventory
    register: _lightspeed_api_pod
    retries: 60
    delay: 20
    until:
      - _lightspeed_api_pod['resources'] | length
      - _lightspeed_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'model-api') | map(attribute='ready') | list | first is defined
      - _lightspeed_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'model-api') | map(attribute='ready') | list | first == true
    kubernetes.core.k8s_info:
      kind: Pod
      api_version: v1
      namespace: "{{ namespace }}"
      label_selectors:
        - "app.kubernetes.io/name={{ _scenario_name }}-aap-lightspeed"
        - "app.kubernetes.io/managed-by=ansible-lightspeed-operator"
        - "app.kubernetes.io/component=ansible-lightspeed-api"

  - name: Preparing for Next Tuesday
    register: _lightspeed_chatbot_api_pod
    retries: 60
    delay: 20
    until:
          # 1. Ensure the pod actually exists
          - _lightspeed_chatbot_api_pod.resources | default([]) | length > 0
          # 2. Ensure container statuses are populated
          - _lightspeed_chatbot_api_pod.resources[0].status.containerStatuses is defined
          # 3. Safely check if the 'ansible-chatbot' container is currently in a 'waiting' state
          - >-
            (_lightspeed_chatbot_api_pod.resources[0].status.containerStatuses | 
            selectattr('name', 'equalto', 'ansible-chatbot') | 
            map(attribute='state') | list | first | default({})).waiting is defined
          # 4. Check if the exact reason for waiting is 'CrashLoopBackOff'
          - >-
            (_lightspeed_chatbot_api_pod.resources[0].status.containerStatuses | 
            selectattr('name', 'equalto', 'ansible-chatbot') | 
            map(attribute='state') | list | first | default({})).waiting.reason | default('') == 'CrashLoopBackOff'
    kubernetes.core.k8s_info:
      kind: Pod
      api_version: v1
      namespace: "{{ namespace }}"
      label_selectors:
        - "app.kubernetes.io/name={{ _scenario_name }}-aap-lightspeed"
        - "app.kubernetes.io/managed-by=ansible-lightspeed-operator"
        - "app.kubernetes.io/component=ansible-lightspeed-chatbot-api"

  - name: Ensure AAP CR is Ready and URL is Populated
    kubernetes.core.k8s_info:
      api_version: aap.ansible.com/v1alpha1
      kind: AnsibleAutomationPlatform
      name: "{{ _scenario_name }}-aap"
      namespace: "{{ namespace }}"
    register: aap_status
    retries: 80
    delay: 10
    until: 
      aap_status.resources | length > 0 and
      aap_status.resources[0].status.conditions | 
        selectattr('type', 'equalto', 'Successful') | 
        selectattr('status', 'equalto', 'True') | 
        list | length > 0 and
      aap_status.resources[0].status.URL is defined and 
      aap_status.resources[0].status.URL | length > 0            

  - name: Get Admin Password Secret
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Secret
      name: "{{ _scenario_name }}-aap-admin-password"
      namespace: "{{ namespace }}" 
    register: admin_secret_info
    when: aap_status.resources | length > 0    

  - name: Display Final Access URL and Credentials
    ansible.builtin.debug:
      msg: |
        *********************************************************
        Ansible Automation Platform is Ready. 
        
        Access URL: {{ aap_status.resources[0].status.URL }}
        
        Admin User: admin 
        Admin Password: {{ admin_secret_info.resources[0].data.password | b64decode }}

        Once logged in, please upload the manifest located at /home/lab-user/manifest_demystify_aap.zip
        *********************************************************
    when: 
      aap_status.resources | length > 0 and 
      admin_secret_info.resources | length > 0          

  - name: Log in to AAP, figure out why ALIA icon won't come up
    ansible.builtin.debug:
      msg: |-
        Log in to AAP, figure out why ALIA icon won't come up
        Find out whats failing
    no_log: false