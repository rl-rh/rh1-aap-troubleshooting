- name: wait a few
  ansible.builtin.pause:
    seconds: 30

- name: Wait for lightspeed api pod
  register: _lightspeed_api_pod
  retries: 60
  delay: 20
  until:
    - _lightspeed_api_pod['resources'] | length
    - _lightspeed_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'model-api') | map(attribute='ready') | list | first is defined
    - _lightspeed_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'model-api') | map(attribute='ready') | list | first == true
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _scenario_name }}-aap-lightspeed"
      - "app.kubernetes.io/managed-by=ansible-lightspeed-operator"
      - "app.kubernetes.io/component=ansible-lightspeed-api"

- name: Wait for lightspeed chatbot api pod
  register: _lightspeed_chatbot_api_pod
  retries: 60
  delay: 20
  until:
    - _lightspeed_chatbot_api_pod['resources'] | length
    - _lightspeed_chatbot_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'ansible-chatbot') | map(attribute='ready') | list | first is defined
    - _lightspeed_chatbot_api_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'ansible-chatbot') | map(attribute='ready') | list | first == true
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _scenario_name }}-aap-lightspeed"
      - "app.kubernetes.io/managed-by=ansible-lightspeed-operator"
      - "app.kubernetes.io/component=ansible-lightspeed-chatbot-api"

- name: Wait for AnsibleLightspeed CR to reach Successful status (Lightspeed API pods spin up and down a few times).
  kubernetes.core.k8s_info:
    api_version: lightspeed.ansible.com/v1alpha1 
    kind: AnsibleLightspeed
    name: "{{ _scenario_name }}-aap-lightspeed"
    namespace: "{{ namespace }}"
  register: lightspeed_status
  retries: 60 
  delay: 10
  until: 
      lightspeed_status.resources | length > 0 and 
      lightspeed_status.resources[0].status.conditions | 
      selectattr('type', 'equalto', 'Successful') |
      selectattr('status', 'equalto', 'True') | 
      list | length > 0

- name: Waiting for Lightspeed reconciliation to complete
  ansible.builtin.debug:
    msg: "Waiting for Lightspeed reconciliation to complete... (Current status: {{ lightspeed_status.resources[0].status.phase | default('Initializing') }})"
  when: 
    lightspeed_status is failed and 
    lightspeed_status.resources | length > 0

- name: Wait for AnsibleLightspeed CR to reach Successful status (Lightspeed API pods spin up and down a few times).
  kubernetes.core.k8s_info:
    api_version: lightspeed.ansible.com/v1alpha1 
    kind: AnsibleLightspeed
    name: "{{ _scenario_name }}-aap-lightspeed"
    namespace: "{{ namespace }}"
  register: lightspeed_status
  retries: 60 
  delay: 10
  until: 
      lightspeed_status.resources | length > 0 and 
      lightspeed_status.resources[0].status.conditions | 
      selectattr('type', 'equalto', 'Successful') |
      selectattr('status', 'equalto', 'True') | 
      list | length > 0    

- name: Verify Lightspeed Status
  ansible.builtin.debug:
    msg: "AnsibleLightspeed CR is now in a Successful state."
  when: lightspeed_status is success 