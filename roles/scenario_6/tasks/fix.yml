- name: Apply correct model
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: chatbot-configuration-secret
    namespace: "{{ namespace }}"
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: chatbot-configuration-secret
        namespace: "{{ namespace }}"
      type: Opaque
      data:
        chatbot_model: "{{ chatbot_model | b64encode }}"
        chatbot_token: "{{ chatbot_token | b64encode }}"
        chatbot_url: "{{ chatbot_url | b64encode }}"

