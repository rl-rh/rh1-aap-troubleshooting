---

- name: Set role variables
  no_log: "{{ nolog | default(True) }}"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
    hash_behaviour: replace

- name: Set the table
  ansible.builtin.set_fact:
    user_confirmation: "no"

- name: Find the issue?
  ansible.builtin.pause:
    prompt: |-
      Did you figure out and fix the issues? There were two issues.
      (yes or no)
      (Entering yes will fix the lab. Enter no, or wait until you find the issue to fix the lab)
    echo: yes
  register: confirmation_input
  until: confirmation_input.user_input is defined and confirmation_input.user_input | lower == 'yes'
  retries: 99999
  delay: 0

- name: Scale down Lightspeed API deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-lightspeed-api"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-lightspeed-api"
        namespace: "{{ namespace }}"
      spec:
        replicas: 0
  register: api_deployment_scale_status

- name: Scale down Lightspeed Chatbot API deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-lightspeed-chatbot-api"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-lightspeed-chatbot-api"
        namespace: "{{ namespace }}"
      spec:
        replicas: 0
  register: chatbot_deployment_scale_status

