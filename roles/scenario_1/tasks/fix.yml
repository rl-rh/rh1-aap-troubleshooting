---
- name: Set role variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
    hash_behaviour: replace

- name: Delete PVC 'scenario-1-hub-storage'
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ _scenario_name }}-hub-file-storage"
    namespace: "{{ _scenario_name }}"
    state: absent

- name: Update AAP custom resource
  kubernetes.core.k8s:
    state: present
    definition:
      kind: AnsibleAutomationPlatform
      apiVersion: aap.ansible.com/v1alpha1
      metadata:
        name: "{{ _scenario_name }}"
        namespace: "{{ namespace }}"
      spec:
        hub:
          file_storage_access_mode: "{{ hub_file_access_mode }}"
          file_storage_size: "{{ hub_file_storage_size }}"
          file_storage_storage_class: "{{ hub_file_storage_class }}"
          storage_type: file

- name: Update Hub custom resource
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: automationhub.ansible.com/v1beta1
      kind: AutomationHub
      metadata:
        name: "{{ _scenario_name }}-hub"
        namespace: "{{ namespace }}"
      spec:
        file_storage_access_mode: "{{ hub_file_access_mode }}"
        file_storage_size: "{{ hub_file_storage_size }}"
        file_storage_storage_class: "{{ hub_file_storage_class }}"
        storage_type: file

