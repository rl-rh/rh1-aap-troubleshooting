---

- name: Set role variables
  no_log: "{{ nolog | default(True) }}"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
    hash_behaviour: replace

- name: Make sure its broken
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-gateway"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-gateway"
        namespace: "{{ namespace }}"
      spec:
        replicas: 0
  register: deployment_scale_status
  no_log: "{{ nolog | default(True) }}"  

