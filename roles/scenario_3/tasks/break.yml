- name: Mic check 1....2....3....
  register: _pg_pod
  retries: 30
  delay: 5
  until:
    - _pg_pod['resources'] | length
    - _pg_pod.resources[0].status.phase == "Pending" 
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=postgres-15"
      - "app.kubernetes.io/instance=postgres-15-{{ _scenario_name }}-aap"
      - "app.kubernetes.io/component=database"  
  no_log: "{{ nolog | default(True) }}"    

- name: Is this thing on?
  register: _gateway_pod
  retries: 30
  delay: 5
  until: 
    _gateway_pod.resources | length > 0 and 
    _gateway_pod.resources | selectattr('status.phase', 'equalto', 'Pending') | list | length > 0
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _scenario_name }}-aap"
      - "app.kubernetes.io/component=aap-gateway"  
  no_log: "{{ nolog | default(True) }}"    
