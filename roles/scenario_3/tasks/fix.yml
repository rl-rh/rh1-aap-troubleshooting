- name: Scale Down AAP PostgreSQL to 0
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ _scenario_name }}-aap-postgres-15"
    namespace: "{{ namespace }}"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ _scenario_name }}-aap-postgres-15"
        namespace: "{{ namespace }}"
      spec:
        replicas: 0
  register: scale_down_status

- name: Wait for PostgreSQL pods to terminate
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ _scenario_name }}-aap-postgres-15"
    namespace: "{{ namespace }}"
  register: ss_status
  until: ss_status.resources[0].status.readyReplicas is not defined or ss_status.resources[0].status.readyReplicas == 0
  retries: 30
  delay: 5

- name: Fixing node_selector
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: aap.ansible.com/v1alpha1
      kind: AnsibleAutomationPlatform
      metadata:
        name: "{{ _scenario_name }}-aap"
        namespace: "{{ namespace }}"
      spec:
        database:
          node_selector:
            "kubernetes.io/os": "linux"

- name: Apply new node selector to PostgreSQL stateful set
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ _scenario_name }}-aap-postgres-15"
    namespace: "{{ namespace }}"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ _scenario_name }}-aap-postgres-15"
        namespace: "{{ namespace }}"
      spec:
        template:
          spec:
            nodeSelector:
              "kubernetes.io/os": "linux"
  register: patch_status

- name: Settings limits/requests to something reasonable
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: aap.ansible.com/v1alpha1
      kind: AnsibleAutomationPlatform
      metadata:
        name: "{{ _scenario_name }}-aap"
        namespace: "{{ install_namespace }}"
      spec:
        api:
          resource_requirements:
            limits:
              cpu: 1000m
              memory: 5Gi
            requests:
              cpu: 400m
              memory: 500Mi

- name: Scale PostgreSQL StatefulSet Back Up to 1 Replica
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ _scenario_name }}-aap-postgres-15"
    namespace: "{{ namespace }}"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ _scenario_name }}-aap-postgres-15"
        namespace: "{{ namespace }}"
      spec:
        replicas: 1
  register: scale_up_status

- name: Wait for 1 PostgreSQL Ready Replica
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ _scenario_name }}-aap-postgres-15"
    namespace: "{{ namespace }}"
  register: ss_ready_status
  until: (ss_ready_status.resources[0].status.readyReplicas | default(0)) == 1
  retries: 30
  delay: 5

- name: Verify PostgreSQL Ready Status
  ansible.builtin.debug:
    msg: "StatefulSet {{ _scenario_name }}-aap-postgres-15 is now scaled up and ready."
  when: ss_ready_status.resources[0].status.readyReplicas == 1

- name: Scale up Gateway deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-gateway"
    state: present
    merge_type: merge
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-gateway"
        namespace: "{{ namespace }}"
      spec:
        replicas: 1
  register: deployment_scale_status

