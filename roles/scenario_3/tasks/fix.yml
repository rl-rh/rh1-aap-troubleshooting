- name: Wait for Automation Controller Task pod
  register: _controller_pod
  retries: 60
  delay: 15
  until:
    - _controller_pod['resources'] | length
    - _controller_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', _scenario_name + '-aap-controller-task') | map(attribute='ready') | list | first is defined
    - _controller_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', _scenario_name + '-aap-controller-task') | map(attribute='ready') | list | first == true
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _scenario_name }}-aap-controller-task"
      - "app.kubernetes.io/managed-by=automationcontroller-operator"
      - "app.kubernetes.io/component=automationcontroller"

- name: Wait for Automation Controller Web pod
  register: _controller_web
  retries: 60
  delay: 15
  until:
    - _controller_web['resources'] | length
    - _controller_web['resources'][0].status.containerStatuses | selectattr('name', 'equalto', _scenario_name + '-aap-controller-web') | map(attribute='ready') | list | first is defined
    - _controller_web['resources'][0].status.containerStatuses | selectattr('name', 'equalto', _scenario_name + '-aap-controller-web') | map(attribute='ready') | list | first == true
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ _scenario_name }}-aap-controller-web"
      - "app.kubernetes.io/managed-by=automationcontroller-operator"
      - "app.kubernetes.io/component=automationcontroller"

- name: Wait for Automation Hub API pod
  register: _hub_pod
  retries: 60
  delay: 15
  until:
    - _hub_pod['resources'] | length
    - _hub_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'api') | map(attribute='ready') | list | first is defined
    - _hub_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', 'api') | map(attribute='ready') | list | first == true
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: "{{ namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=automationhub-api"
      - "app.kubernetes.io/instance=automationhub-api-{{ _scenario_name }}-aap-hub"
      - "app.kubernetes.io/component=api"

- name: Wait for Gateway Deployment to reach 1 Ready Replica
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ _scenario_name }}-aap-gateway"
    namespace: "{{ namespace }}"
  register: deploy_ready_status
  until:
    (deploy_ready_status.resources[0].status.readyReplicas | default(0)) == 1 and
    (deploy_ready_status.resources[0].status.availableReplicas | default(0)) == 1
  retries: 60
  delay: 15

- name: Verify Gateway Ready Status
  ansible.builtin.debug:
    msg: "Deployment {{ _scenario_name }}-aap-gateway is now scaled up and has exactly 1 ready replica."
  when: deploy_ready_status.resources[0].status.readyReplicas == 1

- name: Wait for Hub worker to be Fully Ready with 2 Replicas
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ _scenario_name }}-aap-hub-worker"
    namespace: "{{ namespace }}"
  register: deploy_ready_status
  until:
    (deploy_ready_status.resources[0].status.replicas | default(0)) == 2 and
    (deploy_ready_status.resources[0].status.readyReplicas | default(0)) == 2 and
    (deploy_ready_status.resources[0].status.availableReplicas | default(0)) == 2
  retries: 60
  delay: 15

- name: Verify Full hub worker Deployment Readiness
  ansible.builtin.debug:
    msg: "Deployment {{ _scenario_name }}-aap-hub-worker is fully scaled up and ready with 2 replicas."
  when: deploy_ready_status.resources[0].status.readyReplicas == 2