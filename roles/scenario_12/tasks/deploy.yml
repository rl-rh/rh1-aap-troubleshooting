### Create resources for Automation Controller
- name: Create Inventory - Local
  ansible.controller.inventory:
    name: Local
    organization: Default
    state: present

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Host - Local - localhost
  ansible.controller.host:
    name: localhost
    inventory: Local
    variables:
      ansible_host: 127.0.0.1
      ansible_connection: local
      ansible_python_interpreter: !unsafe "{{ ansible_playbook_python }}"

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Project - {{ scm_project_name }}
  ansible.controller.project:
    name: "{{ scm_project_name }}"
    organization: Default
    scm_type: git
    scm_url: "{{ scm_project_url }}"

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Job Template - Dummy Template
  ansible.controller.job_template:
    name: Ping
    job_type: run
    organization: Default
    inventory: Local
    project: "{{ scm_project_name }}"
    playbook: playbooks/ping.yml
    allow_simultaneous: true
    request_timeout: 60
    verbosity: 3

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

### Create resources for EDA Server
- name: Create Credential - RH AAP
  ansible.eda.credential:
    name: RH AAP Credential
    credential_type_name: Red Hat Ansible Automation Platform
    organization_name: Default
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: false

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Credential - Basic Event Stream
  ansible.eda.credential:
    name: Basic Event Stream Credential
    credential_type_name: Basic Event Stream
    organization_name: Default
    inputs:
      username: "admin"
      password: "admin"

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Decision Environment
  ansible.eda.decision_environment:
    name: "Decision Environment - {{ _scenario_name }}"
    image_url: "registry.redhat.io/ansible-automation-platform-26/de-supported-rhel9:latest"
    organization_name: Default
    state: present

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create Project
  ansible.eda.project:
    name: "{{ scm_project_name }}"
    url: "{{ scm_project_url }}"
    organization_name: Default

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create event stream
  ansible.eda.event_stream:
    name: Event Stream - {{ event_stream_name }}
    uuid: "{{ event_stream_name }}"
    credential_name: Basic Event Stream Credential
    organization_name: Default
    forward_events: true

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false

- name: Create rulebook activation
  ignore_errors: true
  loop:
    - state: absent
    - state: present
  ansible.eda.rulebook_activation:
    name: "{{ scm_project_name }} - Rulebook Activation"
    project_name: "{{ scm_project_name }}"
    rulebook_name: main.yml
    state: "{{ item.state }}"
    organization_name: Default
    restart_policy: always
    decision_environment_name: "Decision Environment - {{ _scenario_name }}"
    event_streams:
      - event_stream: Event Stream - {{ event_stream_name }}
        source_name:  test
    eda_credentials:
      - RH AAP Credential

    # Credentials
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: false
