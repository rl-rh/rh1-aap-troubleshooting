---

- name: Set role variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
    hash_behaviour: replace

- name: Wait for AAP CR to be Ready and URL to be Populated
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ _scenario_name }}-aap"
    namespace: "{{ project_name }}"
  register: aap_status
  retries: 6 # Wait for 30 seconds
  delay: 5
  until:
    - aap_status | community.general.json_query("resources[0].status.conditions[?type=='Successful' && status=='True']")
    - aap_status | community.general.json_query("resources[0].status.URL")

- name: Get admin password
  register: _admin_password
  no_log: "{{ nolog | default(true) }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _scenario_name }}-aap-admin-password"
    namespace: "{{ project_name }}"

- name: Get route
  register: _route_info
  no_log: "{{ nolog | default(true) }}"
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ _scenario_name }}-aap"
    namespace: "{{ project_name }}"

- name: Set credentials to internal variable
  no_log: "{{ nolog | default(true) }}"
  ansible.builtin.set_fact:
    aap_hostname: "https://{{ _route_info.resources[0].spec.host }}"
    aap_username: admin
    aap_password: "{{ _admin_password.resources[0].data['password'] | b64decode }}"

