---

- name: Set role variables
  no_log: "{{ nolog | default(True) }}"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
    hash_behaviour: replace

- name: modify aap cr
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: aap.ansible.com/v1alpha1
      kind: AnsibleAutomationPlatform
      metadata:
        name: "{{ _scenario_name }}-aap"
        namespace: "{{ namespace }}"
      spec:
        database:      
          node_selector:
            "kubernetes.io/os": "not_linux"    

- name: Scale Deployment Down to 0 using Minimal Merge Patch
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-gateway"
    state: present 
    merge_type: merge 
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-gateway"
        namespace: "{{ namespace }}"
      spec:
        replicas: 0
  register: deployment_scale_status            

# - name: Display Scale Status
#   ansible.builtin.debug:
#     msg: "Successfully scaled deployment down to 0 replicas."
#   when: deployment_scale_status is success

- name: Update AAP CR
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: aap.ansible.com/v1alpha1
      kind: AnsibleAutomationPlatform
      metadata:
        name: "{{ _scenario_name }}-aap"
        namespace: "{{ install_namespace }}"
      spec:
        api:
          resource_requirements:
            limits:
              cpu: 1000m
              memory: 500Gi
            requests:
              cpu: 400m
              memory: 500Gi             

- name: Scale Deployment Back up to 1 using Minimal Merge Patch
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ namespace }}"
    name: "{{ _scenario_name }}-aap-gateway"
    state: present 
    merge_type: merge 
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ _scenario_name }}-aap-gateway"
        namespace: "{{ namespace }}"
      spec:
        replicas: 1
  register: deployment_scale_status                     

