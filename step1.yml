---

- name: Install Ansible Automation Platform Operator
  hosts: all
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/vars/step-1.yml"
  roles:
    - role: operator
      install_channel: "stable-2.5"
      install_namespace: "{{ namespace }}"
      install_plan_approval: "Manual"
      install_starting_csv: "aap-operator.v2.5.0-0.1755835086"


- name: Deployment
  hosts: all
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/vars/step-1.yml"
  tasks:
    - name: Create custom resource
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: aap.ansible.com/v1alpha1
          kind: AnsibleAutomationPlatform
          metadata:
            name: aap
            namespace: "{{ namespace }}"
          spec:
            api:
              log_level: INFO
              replicas: 1
            controller:
              auto_upgrade: false
              # TODO
              # for some reason these are failing in the migration step of the operator
              # task_node_selector: 'kubernetes.io/os: linux'
              # web_node_selector: 'kubernetes.io/os: linux'
            database:
              idle_disabled: false
              postgres_data_volume_init: false
              node_selector:
                kubernetes.io/os: linux
            hub:
              disabled: true
            eda:
              disabled: true
            lightspeed:
              disabled: true
            no_log: true
            redis_mode: standalone
            route_tls_termination_mechanism: Edge

    - name: Wait for Automation Gateway pod
      register: _gateway_pod
      retries: 60
      delay: 15
      until:
        - "_gateway_pod['resources'] | length"
        - "_gateway_pod['resources'][0]['status']['phase'] == 'Running'"
        - "_gateway_pod['resources'][0]['status']['containerStatuses'][0]['ready'] == true"
        - "_gateway_pod['resources'][0]['status']['containerStatuses'][1]['ready'] == true"
      kubernetes.core.k8s_info:
        kind: Pod
        api_version: v1
        namespace: "{{ namespace }}"
        label_selectors:
          - "app.kubernetes.io/name={{ instance_name }}"
          - "app.kubernetes.io/managed-by=aap-operator"
          - "app.kubernetes.io/component=aap-gateway"
        field_selectors:
          - status.phase=Running

      # Reference: https://github.com/ansible-automation-platform/aap-gateway-operator/blob/main/roles/ansibleautomationplatform/tasks/wait_for_controller.yml
    - name: Wait for Automation Controller pod
      register: _controller_pod
      retries: 60
      delay: 10
      until:
        - _controller_pod['resources'] | length
        - _controller_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', instance_name + '-controller-task') | map(attribute='ready') | list | first is defined
        - _controller_pod['resources'][0].status.containerStatuses | selectattr('name', 'equalto', instance_name + '-controller-task') | map(attribute='ready') | list | first == true
      kubernetes.core.k8s_info:
        kind: Pod
        api_version: v1
        namespace: "{{ namespace }}"
        label_selectors:
          - "app.kubernetes.io/name={{ instance_name }}-controller-task"
          - "app.kubernetes.io/managed-by=automationcontroller-operator"
          - "app.kubernetes.io/component=automationcontroller"


- name: Configuration-as-code
  hosts: all
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/vars/step-1.yml"
  tasks:
    - name: Create OAuth2 token
      no_log: "{{ nolog | default(true) }}"
      block:
        - name: Get Automation Gateway route
          pass:

        - name: Get admin kubernetes secret
          register: _admin_secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ instance_name }}-admin-password"
            namespace: "{{ namespace }}"

        - name: Set admin password to fact
          ansible.builtin.set_fact:
            _admin_pass: "{{ _admin_secret.resources | first | json_query('data.password') | b64decode }}"

        - name: Get OAuth2 token
          pass:

